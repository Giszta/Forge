services:
  postgres:
    image: postgres:17-alpine
    container_name: forge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: forge
      POSTGRES_PASSWORD: forge_dev_password
      POSTGRES_DB: forge
    ports:
      - "5433:5432"
    volumes:
      - forge_postgres_data:/var/lib/postgresql/data

volumes:
  forge_postgres_data: